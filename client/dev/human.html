<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/jsm/" } }</script></head><body>
<script type="module">
// Preview generated humans: ?a=bubba,chad&anim=idle&t=0.5&cam=x,y,z&look=y
import * as THREE from 'three';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { loadMixamo, skeletonTemplate, mixamoClips } from '../js/mixamo.js';
import { loadHuman, attachHuman } from '../js/humans.js';
import { charTexturesReady, buildHumanGear } from '../js/caricatures.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#9ec3e6');
scene.add(new THREE.HemisphereLight('#dff1ff', '#6b5a40', 1.4));
const sun = new THREE.DirectionalLight('#ffe2b0', 2.6); sun.position.set(3, 6, 5); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: '#7a8a5a' })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
await loadMixamo('../vendor/models/');
const archs = (q.get('a') || 'bubba').split(',');
const t = Number(q.get('t') || 0.5);
let i = 0;
for (const a of archs) {
  const asset = await loadHuman(a);
  if (!asset) { document.title = 'missing ' + a; continue; }
  const model = SkeletonUtils.clone(skeletonTemplate);
  attachHuman(model, asset);
  const bones = {}; model.traverse((o) => { if (o.isBone) bones[o.name.replace(/^mixamorig/, '')] = o; });
  if (!q.get('nogear')) buildHumanGear(bones, bones.Hips.getWorldScale(new THREE.Vector3()).x, a, '#3b82f6', asset.h.metrics);
  const g = new THREE.Group(); g.add(model); g.position.x = (i - (archs.length - 1) / 2) * 1.0; scene.add(g); i++;
  const anim = q.get('anim');
  if (anim && mixamoClips[anim]) { const mx = new THREE.AnimationMixer(model); mx.clipAction(mixamoClips[anim]).play(); mx.update(t); }
  g.rotation.y = Number(q.get('turn') || 0);
}
await charTexturesReady();
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 100);
cam.position.set(...(q.get('cam') || '0,1.2,4.2').split(',').map(Number)); cam.lookAt(0, Number(q.get('look') || 1.0), 0);
await new Promise((res) => setTimeout(res, 300));
r.render(scene, cam); window.__done = true; document.title = 'done';
</script></body></html>
