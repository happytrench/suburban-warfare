<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/jsm/" } }</script></head><body>
<script type="module">
// First-person view check: ?a=hank&w=rifle&ads=0
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { loadMixamo } from '../js/mixamo.js';
import { loadHuman } from '../js/humans.js';
import { loadGuns, realGun } from '../js/guns.js';
import { buildFPArms } from '../js/fparms.js';
import { charTexturesReady } from '../js/caricatures.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#9ec3e6');
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.6;
scene.add(new THREE.HemisphereLight('#ffffff', '#555555', 2.2)); const sun = new THREE.DirectionalLight('#fff1d0', 1.6); sun.position.set(1, 2, 1); scene.add(sun);
await Promise.all([loadMixamo('../vendor/models/'), loadGuns()]);
const asset = await loadHuman(q.get('a') || 'hank');
const cam = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.01, 10); scene.add(cam);
const vm = new THREE.Group(); vm.scale.setScalar(0.55); cam.add(vm);
const ads = Number(q.get('ads') || 0);
const gun = realGun(q.get('w') || 'rifle'); gun.rotation.y = Math.PI; vm.add(gun);
vm.position.set(0.13 * (1 - ads), -0.13 * (1 - ads) - gun.userData.sight.y * 0.55 * ads, -0.22);
const arms = buildFPArms(asset, new THREE.Vector3(-0.13, 0.13, 0.22).divideScalar(0.55)); vm.add(arms.root); arms.pose(gun);
await charTexturesReady(); await new Promise((res) => setTimeout(res, 800));
r.render(scene, cam);
const B = {}; arms.model.traverse((o) => { if (o.isBone) B[o.name.replace(/^mixamorig/, '')] = o; });
const wp = (o) => o.getWorldPosition(new THREE.Vector3()).toArray().map((v) => +v.toFixed(3));
console.log(JSON.stringify({ rh: wp(B.RightHand), lh: wp(B.LeftHand), neck: wp(B.Neck), rarm: wp(B.RightArm), grip: gun.localToWorld(gun.userData.grip.clone()).toArray().map((v) => +v.toFixed(3)), hips: wp(B.Hips) }));
window.__done = true;
</script></body></html>
