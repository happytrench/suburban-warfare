<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/jsm/" } }</script></head><body>
<script type="module">
// Dumps the mocap skeleton's rest pose (used by tools/humans.py to build bodies that fit it).
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
const f = await new FBXLoader().loadAsync('../vendor/models/anims/idle.fbx');
const canon = (n) => n.replace(/^mixamorig\d*[:_]?/, 'mixamorig');
f.updateMatrixWorld(true);
const bones = [];
f.traverse((o) => { if (o.isBone) { const w = new THREE.Vector3(); o.getWorldPosition(w); const q = new THREE.Quaternion(); o.getWorldQuaternion(q);
  bones.push({ name: canon(o.name), parent: o.parent && o.parent.isBone ? canon(o.parent.name) : null, pos: o.position.toArray(), quat: o.quaternion.toArray(), scale: o.scale.toArray(), world: w.toArray(), wq: q.toArray() }); } });
const posTracks = f.animations[0].tracks.filter((t) => t.name.endsWith('.position')).map((t) => canon(t.name));
window.__dump = { rootScale: f.scale.toArray(), bones, posTracks }; window.__done = true;
</script></body></html>
