<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Art preview</title>
  <style>html,body{margin:0;overflow:hidden;background:#000}</style>
  <script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/jsm/" } }</script>
</head>
<body>
<script type="module">
  // Dev-only art preview: renders a map from a fixed camera. Usage: /dev/preview.html?map=culdesac&shot=0
  import * as THREE from 'three';
  import { getMap } from '../shared/map.js';
  import { buildWorld, buildSky, setQuality } from '../js/world.js';
  import { loadTreeTextures } from '../js/trees.js';
  import { buildCharacter, nameTag } from '../js/characters.js';

  const q = new URLSearchParams(location.search);
  const map = getMap(q.get('map') || 'culdesac');
  const quality = q.get('q') === 'low' ? 'low' : 'high';
  setQuality(quality);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if (quality === 'high') { renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; }
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const t = map.theme;
  scene.fog = new THREE.Fog(t.fog, t.fogNear ?? 45, t.fogFar ?? 170);
  scene.add(buildSky(t, map.id));
  scene.add(new THREE.HemisphereLight(t.hemiSky || '#dff1ff', t.hemiGround, t.hemiIntensity ?? 1.5));
  const sun = new THREE.DirectionalLight(t.sunColor || '#ffe2b0', t.sunIntensity ?? 3);
  if (t.exposure) renderer.toneMappingExposure = t.exposure;
  sun.position.set(...(t.sunPos || [55, 38, 35]));
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
  Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, far: 200 });
  scene.add(sun);
  await loadTreeTextures();
  await (await import('../js/textures.js')).loadPhotoTextures();
  await (await import('../js/props.js')).loadProps();
  scene.add(buildWorld(map));

  const chars = q.get('lineup') ? [
    { id: 2, x: -1.8, z: 24, yaw: Math.PI, outfit: 'suburban', color: '#7dd3fc', name: 'Chad' },
    { id: 3, x: -0.6, z: 24, yaw: Math.PI, outfit: 'suburban', color: '#f9a8d4', name: 'Karen' },
    { id: 4, x: 0.6, z: 24, yaw: Math.PI, outfit: 'country', color: '#8f2a1e', name: 'Bubba' },
    { id: 5, x: 1.8, z: 24, yaw: Math.PI, outfit: 'country', color: '#7a5a2a', name: 'Darlene' },
  ] : [
    { id: 2, x: 1.2, z: 23, yaw: Math.PI - 0.5, outfit: 'suburban', color: '#2f5d8a', name: 'Chad (HOA)' },
    { id: 4, x: 4.3, z: 21.5, yaw: Math.PI + 0.6, outfit: 'country', color: '#8f2a1e', name: 'Bubba' },
  ];
  for (const c of chars) {
    const m = buildCharacter({ id: c.id, color: c.color, outfit: c.outfit, quality });
    m.position.set(c.x, 0, c.z); m.rotation.y = c.yaw;
    const tag = nameTag(c.name, c.color); tag.position.y = 2.25; m.add(tag);
    scene.add(m);
  }
  const shots = [
    { p: [3.4, 1.9, 28], t: [1.5, 1.4, 10] },
    { p: [-40, 26, 48], t: [0, 0, -6] },
    { p: [0, 60, 40], t: [0, 0, -4] },
    { p: [6, 5, 40], t: [38, 3, 8] },
    { p: [-2, 3, 36], t: [-2, 2, 0] },
    { p: [-30, 70, 95], t: [5, 0, -5] },
    { p: [-30, 4, 30], t: [40, 3, 0] },
  ];
  let s = shots[Number(q.get('shot') || 0)] || shots[0];
  if (q.get('cam')) s = { p: q.get('cam').split(',').map(Number), t: q.get('look').split(',').map(Number) };
  const cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 900);
  cam.position.set(...s.p); cam.lookAt(...s.t);
  renderer.render(scene, cam);
  const info = renderer.info.render;
  document.title = `done calls=${info.calls} tris=${info.triangles}`;
  window.__done = true;
</script>
</body>
</html>
