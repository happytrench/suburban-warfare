<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/jsm/" } }</script></head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { loadGuns, realGun } from '../js/guns.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#8a9aa8');
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight('#ffffff', '#445', 1.0)); const sun = new THREE.DirectionalLight('#fff', 2.5); sun.position.set(2, 3, 2); scene.add(sun);
await loadGuns();
const kinds = (q.get('k') || 'rifle,shotgun,deer').split(',');
kinds.forEach((k, i) => { const g = realGun(k); g.position.y = (kinds.length - 1) / 2 * 0.3 - i * 0.3; g.rotation.y = -Math.PI / 2; scene.add(g);
  const ax = new THREE.AxesHelper(0.05); ax.position.copy(g.position); scene.add(ax);
  for (const key of ['grip', 'fore', 'muzzle', 'sight']) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.006), new THREE.MeshBasicMaterial({ color: { grip: 'red', fore: 'lime', muzzle: 'yellow', sight: 'cyan' }[key] })); m.position.copy(g.userData[key]).applyAxisAngle(new THREE.Vector3(0, 1, 0), -Math.PI / 2).add(g.position); scene.add(m); } });
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 50);
cam.position.set(...(q.get('cam') || '0.15,0.05,2.3').split(',').map(Number)); cam.lookAt(0.15, -0.05, 0);
await new Promise((res) => setTimeout(res, 1500)); r.render(scene, cam); window.__done = true;
</script></body></html>
