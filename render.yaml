# Render Blueprint — one free web service that serves the game and the multiplayer WebSocket.
services:
  - type: web
    name: suburban-warfare
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
